services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  storage:
    # Official maintained S3 server. Version pinned; separate volume avoids
    # reinterpreting any data from a previous MinIO install.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "/etc/partyphoto/storage-entrypoint.sh"]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - seaweed:/data
      - ./infra/storage/entrypoint.sh:/etc/partyphoto/storage-entrypoint.sh:ro,Z
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      S3_ENDPOINT: http://storage:9000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      S3_ENDPOINT: http://storage:9000
    command: ["node", "scripts/media-worker.mjs"]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
volumes:
  postgres:
  seaweed:
